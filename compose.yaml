services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ruian
      POSTGRES_USER: ruian
      POSTGRES_PASSWORD: ruian
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data directory under /var/lib/postgresql (not .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  db-data:
